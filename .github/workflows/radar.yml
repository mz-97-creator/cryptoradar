name: CryptoRadar Codex research

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cryptoradar-codex-research
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == 'refs/heads/codex/research-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-research.txt
      - name: Test research labels and alert settlement
        run: python -m unittest tests.test_research_integrity tests.test_leading
      - name: Restore the last successful Codex snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          previous_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow radar.yml --branch codex/research-v1 --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$previous_run" ]; then
            gh run download "$previous_run" --repo "$GITHUB_REPOSITORY" --name codex-research-snapshot --dir prev
          fi
      - name: Scan into isolated research files
        run: python cloud_run.py --config codex_config.yaml --prev prev --out out
      - name: Collect leading sources and run locked time study
        run: |
          python leading_collect.py --plan leading_plan.json --out prev/leading_data --workers 3
          python leading_study.py --plan leading_plan.json --data prev/leading_data --out out/leading_research
          cp -r prev/leading_data out/leading_data
      - name: Reject stale or failed snapshots
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          s = json.loads(Path('out/signals.json').read_text())
          if s.get('error') or not s.get('quality', {}).get('market_usable'):
              raise SystemExit('Scan failed or universe coverage is insufficient; preserving previous successful snapshot')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-research-snapshot
          path: out/
          retention-days: 90
