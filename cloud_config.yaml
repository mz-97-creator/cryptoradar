# CryptoRadar 云端版配置(GitHub Actions 使用)。改完提交到 main 分支,会自动重新扫描一次。

universe:
  top_n: 150            # CoinGecko 市值前 N 名,再与 OKX USDT 永续取交集
  watchlist: [OP, HYPE, ETH, AAVE, ARB, PUMP, SOL, XRP, FIL, STX]   # 自选:推送门槛更低,每次单独列出;ARB 作为 OP 的同类对照
  exclude: []

signals:
  cooldown_hours: 6       # 同一代币同一规则 6 小时内不重复算作新事件
  min_score_to_push: 2.5  # 普通代币:规则权重合计 ≥ 2.5 才算事件
  watchlist_min_score: 1.0
  thresholds:
    oi_z: 2.0
    resid_z: 2.5
    funding_z: 2.5
    funding_abs: 0.001
    vol_z: 2.5
    ret1h_z: 3.5
    ls_z: 2.5

# 早期检测(实验,见 cryptoradar/early.py 和 studies/early_study.md):专门抓行情启动阶段。
# 历史检验(studies/early_study.md):价格/现货类能更早响但触发后没有显著超额,只展示和留档;
# 回购/协议收入加速 F_REV_UP 是唯一有超额的(1~2 周),先只对自选币推送。
# push: false / watchlist(只推自选) / true(全部推);实盘 1~2 个月后看 status.md 的"早期检测"一节再调整
early:
  enabled: true
  push: watchlist         # 只推自选币
  push_detectors: [F_REV_UP]   # 只推历史检验里站得住的"回购/协议收入加速"(t≈2.8),其余只展示和留档
  push_cooldown_hours: 168     # 同一币同一检测推送后 7 天内不再推(回购加速常连续好几天成立)
  cooldown_hours: 24      # 同一币同一检测 24 小时内只留档一次
  thresholds: {}          # 不写用默认值,见 early.DEFAULTS

# 基本面(DefiLlama,免费):每轮最多花 budget_seconds 秒刷新最久没更新的币,每币每天一次,结果存 data 分支 fundamentals.json。
# 供早期检测 F_REV_UP / F_FEES_UP / F_TVL_UP 和回购收益率的实时值使用
fundamentals:
  enabled: true
  budget_seconds: 60

# 事件库(cryptoradar/events.py):OKX/币安上新公告、各交易所交易对清单比对、HYPE 链上回购执行。只记录和展示,不推送
events:
  enabled: true
  budget_seconds: 20

# 价位提醒:价格穿越时生成一次事件
price_alerts:
  - symbol: OP
    below: 0.12
    note: "日线看涨失效位"
  - symbol: OP
    below: 0.095
    note: "关键支撑"

# 资金费率提醒(8h 口径,小数:0.0003 = 0.03%)。越过阈值时生成一次事件,回到阈值内后重新生效。
# position_usdt 是你的仓位名义价值(保证金 × 杠杆),用来估算每天的资金费;不填就只报费率。
# 这里只管持仓成本;"费率异常"作为信号仍由上面的 funding_z / funding_abs 规则负责。
funding_alerts:
  - symbol: OP
    above: 0.0003          # 基准的 3 倍:多头开始拥挤,持仓成本明显上升
    position_usdt: 3138    # 按 1046 保证金 × 3 倍估算,仓位变了就改这里
    note: "多头拥挤,持仓成本上升"
  - symbol: OP
    above: 0.001           # 0.1%/8h:极端拥挤,警惕多头踩踏
    position_usdt: 3138
    note: "极端拥挤,考虑降杠杆"
  - symbol: OP
    below: 0.0             # 转负:空头付钱给多头,空头拥挤
    position_usdt: 3138
    note: "空头拥挤,多头持仓反而收钱"

display_timezone: Asia/Singapore

# 回购收益率 = 年化回购额 ÷ 当前流通市值(市值每轮从 CoinGecko 自动取,回购额手填,有新数据就更新)
# annual_usd 直接填美元;annual_eth 按当轮 ETH 价格折算。PUMP 还有约 44% 供应未释放,按 FDV 算收益率会低很多。
buybacks:
  - symbol: HYPE
    annual_usd: 555000000
    basis: "2026 年 1–8 月约 3.7 亿美元,年化"
  - symbol: PUMP
    annual_usd: 300000000
    basis: "2026 年 1–8 月约 2 亿美元,年化;近期周收入约 1600 万美元"
  - symbol: AAVE
    annual_usd: 50000000
    basis: "Aavenomics:每年 5000 万美元,2025-11 起常态化"
  - symbol: OP
    annual_eth: 2934
    basis: "Superchain 收入的 50%(前 12 个月 5868 ETH),2026-02 起每月回购"
